# WASM-обёртка FRV1 (декодер + энкодер). Единственный crate с `unsafe` (минимальный FFI).

[package]
name = "frc-v-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
frc-v = { workspace = true }

# Override workspace unsafe_code = forbid for this FFI shim only.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
