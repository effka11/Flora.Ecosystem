[package]
name = "flora-content"
description = "Модуль Content: лента, посты, комментарии, сообщества, FIRA-F/C (переносится в Фазе 3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["multipart"] }
chrono = { workspace = true }
fira-core = { workspace = true }
flora-auth-contracts = { workspace = true }
flora-content-contracts = { workspace = true }
frc-i-integration = { workspace = true }
flora-notifications-contracts = { workspace = true }
flora-shared = { workspace = true }
flora-users-contracts = { workspace = true }
getrandom = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# macros — для sqlx::migrate! (MIGRATOR модуля, §11.1)
sqlx = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "process", "io-util", "fs"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
flora-auth = { workspace = true }
flora-shared = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
