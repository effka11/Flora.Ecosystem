# CI Flora.Ecosystem — обязательные ворота перед merge в main.
# Имена джобов (architecture, ts, web, rust) используются как required status checks
# в защите ветки — см. Scripts/setup-github-protection.ps1. Не переименовывать без синхронизации.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Rust crate boundaries
        shell: pwsh
        run: ./Tools/validate-architecture-rust.ps1

  ts:
    name: ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Workspaces: Apps/Mobile + Packages/* (client-core). Тесты client-core читают
      # Artifacts/contract-fixtures — кросс-языковой контракт с бэкендом.
      - name: Install
        run: npm ci
      - name: Typecheck + lint + test
        run: npm run ci
      # Keep the Mobile session suite an explicit required step: root workspace
      # discovery must not be able to turn these tests into a false green.
      - name: Test Mobile
        run: npm run test --workspace=@flora/mobile

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # Web depends on @flora/client-core via file:; tsc resolves into Packages/
          # source, so workspace deps (uuid, @noble/*) must be installed at the root.
          cache-dependency-path: |
            package-lock.json
            Apps/Web/package-lock.json
      - name: Install workspaces
        run: npm ci
      - name: Install Web
        working-directory: Apps/Web
        run: npm ci
      - name: Typecheck
        working-directory: Apps/Web
        run: npm run typecheck
      # Apps/Web is not a root npm workspace, so root `npm run ci` never runs it.
      - name: Test Web
        run: npm --prefix Apps/Web test
      # TODO: включить после погашения eslint-долга в Apps/Web (~109 существующих ошибок
      # react-hooks/* — чинить отдельной задачей, не в рамках настройки CI):
      # - name: Lint
      #   working-directory: Apps/Web
      #   run: npm run lint

  # Rust pipeline (repo-root Cargo.toml: Backend + Products).
  # Toolchain: rust-toolchain.toml at repo root.
  rust:
    name: rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flora_core
          POSTGRES_USER: flora
          POSTGRES_PASSWORD: flora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flora -d flora_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: flora_core
      PGUSER: flora
      PGPASSWORD: flora_ci
      FLORA_CI_PG_CONNECTION: >-
        Host=127.0.0.1;Port=5432;Database=flora_core;Username=flora;Password=flora_ci;Search Path=flora_core,public;SSL Mode=Disable
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # flora-verification (prost/tonic) — gRPC stubs from Infrastructure/Flora.gRPC/Protos
      - name: Install protoc and PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler postgresql-client
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Prepare disposable cutover schema
        run: >-
          psql --set=ON_ERROR_STOP=1
          --file=Scripts/sql/ci-auth-refresh-legacy-schema.sql
      - name: Apply real module migrations
        run: |
          cargo run -p flora-migrate --locked -- --dry-run
          cargo run -p flora-migrate --locked -- --connection "$FLORA_CI_PG_CONNECTION"
      - name: Verify migration and old API compatibility
        run: >-
          psql --set=ON_ERROR_STOP=1
          --file=Scripts/sql/ci-auth-refresh-verify.sql
      - name: Test Auth replay against PostgreSQL
        env:
          FLORA_AUTH_REPLAY_PG: "1"
          FLORA_AUTH_REPLAY_PG_URL: ${{ env.FLORA_CI_PG_CONNECTION }}
        run: >-
          cargo test -p flora-auth --test refresh_replays_pg --locked --
          --nocapture --test-threads=1
      - name: Test
        run: cargo test --workspace --locked
      - name: Licenses, bans, advisories (cargo deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml

  # FEP wasm32 (Products/FEP): ядро и C-ABI шим клиентской верификации LIV
  # (FEP.md §10 — обязательная проверка; потребитель — @flora/client-core/economy).
  fep-wasm:
    name: fep-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Check FEP core on wasm32
        run: cargo check -p flora-economy-crypto --target wasm32-unknown-unknown --locked
      - name: Check FEP WASM shim on wasm32
        run: cargo check -p flora-economy-wasm --target wasm32-unknown-unknown --locked

  # FRC cores wasm32 (Products/FRC, same workspace).
  codecs-frc:
    name: codecs-frc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Check FRC-A core on wasm32
        run: cargo check -p frc-a-core --target wasm32-unknown-unknown --locked
      - name: Check FRC-I on wasm32
        run: cargo check -p frc-i --no-default-features --target wasm32-unknown-unknown --locked
      - name: Check FRC-I WASM shim on wasm32
        run: cargo check -p frc-i-wasm --target wasm32-unknown-unknown --locked
      - name: Test FRC-I integration adapters
        run: cargo test -p frc-i-integration --locked
      - name: Check FRC-V on wasm32
        run: cargo check -p frc-v --target wasm32-unknown-unknown --locked
