[package]
name = "flora-notifications"
description = "Модуль Notifications: SSE-хаб, FCM-пуши, уведомления (переносится в Фазе 4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
fsa-core = { workspace = true }
flora-auth-contracts = { workspace = true }
flora-messaging-contracts = { workspace = true }
flora-notifications-contracts = { workspace = true }
flora-shared = { workspace = true }
flora-users-contracts = { workspace = true }
futures-util = "0.3"
jsonwebtoken = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["macros", "migrate"] }
subtle = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
flora-auth = { workspace = true }
flora-shared = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
