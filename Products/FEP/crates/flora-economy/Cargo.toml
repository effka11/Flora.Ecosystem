[package]
name = "flora-economy"
description = "Модуль Economy: Flora Economic Protocol (FEP) — LIV, PoP-UBI, демерредж, взаимный кредит, проверяемый журнал. Рождается сразу в Rust (в strangler-миграции не участвует)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
flora-economy-contracts = { workspace = true }
flora-economy-crypto = { workspace = true }
flora-shared = { workspace = true }
flora-verification-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
uuid = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
