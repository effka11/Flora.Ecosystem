# CI Flora.Ecosystem — обязательные ворота перед merge в main.
# Имена джобов (dotnet, architecture, ts, web, rust) используются как required status checks
# в защите ветки — см. Scripts/setup-github-protection.ps1. Не переименовывать без синхронизации.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Flora.Ecosystem.slnx --configuration Release
      # Тесты самодостаточны: health-тест поднимает WebApplicationFactory (Development,
      # эфемерный JWT-секрет), фикстуры контрактов закоммичены в artifacts/contract-fixtures.
      - name: Test
        run: dotnet test Flora.Ecosystem.slnx --configuration Release --no-build

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate C# module boundaries
        shell: pwsh
        run: ./tools/Validate-Architecture.ps1
      # cargo metadata сам подтянет toolchain из Backend/rust-toolchain.toml.
      - name: Validate Rust crate boundaries
        shell: pwsh
        run: ./tools/validate-architecture-rust.ps1

  ts:
    name: ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Workspaces: Apps/Mobile + Packages/* (client-core). Тесты client-core читают
      # artifacts/contract-fixtures — кросс-языковой контракт с бэкендом.
      - name: Install
        run: npm ci
      - name: Typecheck + lint + test
        run: npm run ci

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # Web depends on @flora/client-core via file:; tsc resolves into Packages/
          # source, so workspace deps (uuid, @noble/*) must be installed at the root.
          cache-dependency-path: |
            package-lock.json
            Apps/Web/package-lock.json
      - name: Install workspaces
        run: npm ci
      - name: Install Web
        working-directory: Apps/Web
        run: npm ci
      - name: Typecheck
        working-directory: Apps/Web
        run: npm run typecheck
      # TODO: включить после погашения eslint-долга в Apps/Web (~109 существующих ошибок
      # react-hooks/* — чинить отдельной задачей, не в рамках настройки CI):
      # - name: Lint
      #   working-directory: Apps/Web
      #   run: npm run lint

  # Rust-конвейер (next-architecture.md §2.3, Фаза 0).
  # Toolchain не задаётся в workflow: rustup читает Backend/rust-toolchain.toml —
  # единственный источник версии (обновление — осознанным коммитом).
  rust:
    name: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Backend
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Licenses, bans, advisories (cargo deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Backend/Cargo.toml

  # Аудио-кодек FAC (docs/codecs/FAC.md) — отдельный workspace Codecs/audio.
  # Ядро дополнительно проверяется на wasm32: E2E-голосовые кодируются на клиенте.
  codecs-audio:
    name: codecs-audio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codecs/audio
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Codecs/audio
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check core on wasm32
        run: cargo check -p fac-core --target wasm32-unknown-unknown --locked
      - name: Licenses, bans, advisories (cargo deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Codecs/audio/Cargo.toml
