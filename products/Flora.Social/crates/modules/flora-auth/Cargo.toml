[package]
name = "flora-auth"
description = "Модуль Auth: сессии, JWT, 2FA (переносится в Фазе 2b; JWT-примитивы — с Фазы 0)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Retry-safe replay refresh protocol (plan §2). Off by default so it can be
# shipped disabled first (staged rollout). When on, `compose` defaults the
# runtime switch to enabled; `Auth:RetrySafeRefresh` config still overrides it.
default = []
retry-safe-refresh = []

[dependencies]
flora-shared = { workspace = true }
flora-users-contracts = { workspace = true }
flora-verification-contracts = { workspace = true }
flora-auth-contracts = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
data-encoding = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
# macros — для sqlx::migrate! (MIGRATOR модуля, §11.1)
sqlx = { workspace = true, features = ["macros"] }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
