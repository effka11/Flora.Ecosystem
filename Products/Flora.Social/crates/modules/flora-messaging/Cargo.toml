[package]
name = "flora-messaging"
description = "Модуль Messaging: FSCP E2E, идемпотентность, voice/image/video ассеты (переносится в Фазе 4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["multipart"] }
base64 = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
flora-auth-contracts = { workspace = true }
flora-messaging-contracts = { workspace = true }
flora-shared = { workspace = true }
flora-users-contracts = { workspace = true }
fscp-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# macros — для sqlx::migrate! (Rust-миграции модуля, next-architecture.md §11.1).
sqlx = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["rt", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
flora-auth = { workspace = true }
flora-shared = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
