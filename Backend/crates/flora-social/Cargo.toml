[package]
name = "flora-social"
description = "Продукт Flora.Social: композиция модулей и объединение роутеров, без бизнес-логики"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Правило §2.3: продукт зависит от корней модулей и flora-shared.
[dependencies]
flora-shared = { workspace = true }
flora-auth = { workspace = true }
flora-economy = { workspace = true }
flora-users = { workspace = true }
flora-content = { workspace = true }
flora-messaging = { workspace = true }
flora-music = { workspace = true }
flora-notifications = { workspace = true }
flora-verification = { workspace = true }
axum = { workspace = true }

[dev-dependencies]
http = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt"] }
