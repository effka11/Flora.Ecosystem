# Cargo-workspace аудио-кодека FRC-A (docs/codecs/FRC-A.md).
# Отдельный workspace: кодек — переиспользуемая медиатехнология, не бизнес-модуль Backend.
# Конвенции (edition, rust-version, lints, лицензия) зеркалят Backend/Cargo.toml.

[workspace]
resolver = "3"
members = ["crates/frc-a-core", "crates/frc-a-cli"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
frc-a-core = { path = "crates/frc-a-core" }
hound = "3.5.1"
clap = { version = "4.6.1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# DSP-тесты (O(N²) MDCT) в чистом debug слишком медленные; debug_assertions остаются.
[profile.test]
opt-level = 2
