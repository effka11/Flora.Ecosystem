[package]
name = "flora-users"
description = "Модуль Users: профили, подписки, блокировки, FIRA-P (переносится в Фазе 2b)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["multipart"] }
chrono = { workspace = true }
fira-core = { workspace = true }
flora-auth-contracts = { workspace = true }
flora-content-contracts = { workspace = true }
frc-i-integration = { workspace = true }
flora-notifications-contracts = { workspace = true }
flora-shared = { workspace = true }
flora-users-contracts = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# macros — для sqlx::migrate! (MIGRATOR модуля, §11.1)
sqlx = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
flora-auth = { workspace = true }
flora-shared = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
