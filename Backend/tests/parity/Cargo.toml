[package]
name = "flora-parity"
description = "Паритет-харнесс: семантический JSON-дифф, flora-diff (replay на два апстрима), тесты golden-векторов и contract fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Тестовая инфраструктура: исключена из правил границ §2.3 (см. tools/validate-architecture-rust.ps1) —
# ей по определению нужны реализации всех модулей для паритетных прогонов.
[dependencies]
flora-shared = { workspace = true }
flora-auth = { workspace = true }
flora-content = { workspace = true }
flora-messaging = { workspace = true }
flora-music = { workspace = true }
flora-users = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uuid = { workspace = true }

[dev-dependencies]
argon2 = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
ml-kem = { workspace = true }
sha2 = { workspace = true }
x25519-dalek = { workspace = true }

[[bin]]
name = "flora-diff"
path = "src/bin/flora_diff.rs"

[[bin]]
name = "gen-cross-vectors"
path = "src/bin/gen_cross_vectors.rs"
