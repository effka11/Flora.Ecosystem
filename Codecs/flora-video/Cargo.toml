# Workspace видеокодека FVC (Flora Video Codec). Независим от Backend/ — см. Codecs/README.md.

[workspace]
resolver = "3"
members = [
    "crates/fvc",
    "crates/fvc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

# Кодек тестируем на реалистичных объёмах данных — dev-профиль без оптимизаций слишком медленный.
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
